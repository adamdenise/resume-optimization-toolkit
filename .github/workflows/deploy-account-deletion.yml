name: Worknely Account Deletion Backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worknely-account-deletion-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xuyronnwsokfadnekeir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate backend file
        run: |
          test -s supabase/functions/worknely-delete-account/index.ts
          echo "Backend file verified."

      - name: Validate deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          echo "Deployment token available."

      - name: Verify Edge Functions access
        run: |
          curl --silent --show-error --fail \
            --output /dev/null \
            --write-out "Edge Functions API HTTP status: %{http_code}\n" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions"

      - name: Deploy Worknely backend
        run: |
          curl --silent --show-error --fail \
            --request POST \
            --output /dev/null \
            --write-out "Deployment HTTP status: %{http_code}\n" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --form 'metadata={"name":"worknely-delete-account","entrypoint_path":"index.ts","verify_jwt":true}' \
            --form 'file=@supabase/functions/worknely-delete-account/index.ts;filename=index.ts' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/deploy?slug=worknely-delete-account"

      - name: Verify deployed function
        run: |
          curl --silent --show-error --fail \
            --output /dev/null \
            --write-out "Function verification HTTP status: %{http_code}\n" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/worknely-delete-account"

      - name: Deployment completed
        run: |
          echo "Worknely backend deployment completed."
          echo "Version: 7.21.4.2"
          echo "Mode: Direct Management API"
