name: Worknely Supabase Access Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install official Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI installation
        run: supabase --version

      - name: Verify Edge Functions access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: Missing access token."
            exit 1
          fi

          supabase functions list \
            --project-ref xuyronnwsokfadnekeir

          echo "SUCCESS: Supabase CLI access verified."
