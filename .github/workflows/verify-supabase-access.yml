name: Worknely Supabase Access Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xuyronnwsokfadnekeir

    steps:
      - name: Verify token availability
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: Missing access token"
            exit 1
          fi
          echo "Access token available."

      - name: Verify Supabase API access
        run: |
          STATUS=$(curl --silent --show-error \
            --max-time 30 \
            --output /dev/null \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "API access verification failed."
            exit 1
          fi

          echo "SUCCESS: Supabase API access verified."
